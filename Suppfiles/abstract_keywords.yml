abstract: |
  Background. Studies of Allen's rule — the tendency for endotherms to have longer appendages in warmer climates — require quantifying appendage length relative to body size. Two approaches dominate the empirical literature: simple ratios, and multiple regression with body size as a covariate. These approaches encode different, rarely made explicit, assumptions about the scaling relationship between appendage and body size.

  Aims. We characterize what quantity each of six common statistical approaches — including a newly introduced approach, the Standardized Length Index (SLI) — estimates when applied to simulated temperature-associated shape change, and how each approach's implicit or explicit assumption about allometric scaling shapes that estimate.

  Methods. We simulated morphological data for 252 hypothetical species drawn from a multivariate normal distribution, varying appendage–mass correlation, allometric scaling slope, and the direction of temperature's effect on shape. Each dataset was analysed with two ratio approaches, two multiple regression approaches, and two versions of the SLI — one using an isometric scaling exponent ($b_{SLI} = 0.33$) and one using the empirically estimated SMA slope. We also confronted the six methods with empirical data from 95 species and three independent datasets collected across spatial and temporal temperature gradients.

  Results. Ratio methods and OLS-based approaches (multiple regression, residual regression) diverged systematically from an isometric-relative reference quantity, in opposite directions and for different reasons: ratios inherited body-size dependence from their fixed exponent, while OLS-based approaches conditioned on an assumed directional relationship between mass and appendage. SLI-isometry tracked the isometric reference closely, as expected given their shared theoretical basis, while SLI-estimated diverged from it whenever a species' own allometric scaling departed from isometry — showing that the two SLI parameterizations target distinct quantities rather than one simply outperforming the other. The same pattern of systematic divergence among methods was reproduced across three independent empirical datasets.

  Main conclusions. Conclusions regarding adherence to Allen's rule depend substantially on the statistical approach used to define relative appendage length, because different approaches encode different assumptions about allometric scaling and consequently estimate different quantities. The SLI, based on standardized major axis regression, makes this reference relationship explicit and offers two parameterizations — anchored to isometry or to a species' own empirical scaling — corresponding to two distinct, legitimate questions about relative appendage change, implemented in a single function call in R.
keywords: 
  - Allen's rule, Bergmann's rule, ecogeography, multiple regression, ratios, relative appendage length, review, standaridzed length index, standardized major axis regression, thermoregulation
  
