abstract: |
 1. Studies of Allen’s rule, the tendency for endotherms to have relatively longer appendages in warmer climates, require quantifying appendage length relative to body size. Two approaches dominate the empirical literature: simple ratios and multiple regression with body size as a covariate. These approaches differ in how they define and quantify relative appendage size, including assumptions about allometric scaling and how temperature-associated variation in body size and appendage size is partitioned.
 2. I characterize the statistical behavior of ratios and multiple regression, plus a newly introduced Scaled Length Index (SLI), using morphological data from 252 simulated species in the context of temperature-associated shape change. I vary appendage-mass correlation, allometric scaling relationships, and the direction of temperature effects on shape. Each dataset was analysed with two ratio approaches, two ordinary least squares (OLS)-based approaches (including multiple regression), and two SLI versions (isometric or empirically estimated scaling exponent). I also applied the six methods to three empirical datasets containing 67 species sampled across spatial and temporal temperature gradients.
 3. Ratio methods diverged positively whereas OLS-based approaches diverged negatively from an isometrically defined reference quantity. SLI-isometry tracked the isometric reference quantity closely, as expected, given their shared theoretical basis. SLI-estimated diverged from the reference whenever a species’ own allometric scaling departed from isometry. The same pattern of systematic divergence among methods was reproduced across the empirical datasets. Moreover, in assessing binary adherence to Allen’s rule, only 18% of species exhibiting Bergmannian clines reached the same biological conclusion regardless of the method used.
 4. Method choice can greatly affect conclusions regarding adherence to Allen’s rule. No single approach provides a universally ‘correct’ measure, but the SLI methods offer greater transparency, interpretability, and flexibility over ratio approaches. Multiple regression answers a specific question about the conditional relationship between appendage and temperature, which is appropriate in many contexts. Researchers should explicitly define their research question and match the estimator to it. `\par`{=latex}
keywords:
  - Allen's rule
  - ecogeography
  - multiple regression
  - ratios
  - relative appendage length
  - residuals
  - scaled length index
  - standardized major axis regression

