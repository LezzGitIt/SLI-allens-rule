abstract: |
 1. Studies of Allen’s rule, the tendency for endotherms to have relatively longer appendages in warmer climates, require quantifying appendage length relative to body size. Two approaches dominate the empirical literature: simple ratios and multiple regression with body size as a covariate. These approaches differ in how they define and quantify relative appendage size, including assumptions about allometric scaling and how temperature-associated variation in body size and appendage size is partitioned.
 2. I characterize the statistical behavior of common statistical approaches, including a newly introduced Standardized Length Index (SLI), when applied to simulated temperature-associated shape change. I simulated morphological data for 252 hypothetical species drawn from a multivariate normal distribution, varying appendage-mass correlation, allometric scaling slope, and the direction of temperature’s effect on shape. Each dataset was analysed with two ratio approaches, two ordinary least squares (OLS)-based approaches (multiple regression, residual regression), and two versions of the SLI, one using an isometric scaling exponent and one using the empirically estimated slope. I also applied the six methods to three empirical datasets containing 67 species sampled across spatial and temporal temperature gradients.
 3. Methods define relative appendage length against different reference relationships and consequently estimate different quantities. Ratio methods and OLS-based approaches diverged systematically and in opposite directions from an isometrically defined reference quantity: ratio methods diverged positively, whereas OLS-based approaches diverged negatively. SLI-isometry tracked the isometric reference quantity closely, as expected given their shared theoretical basis, whereas SLI-estimated diverged from it whenever a species’ own allometric scaling departed from isometry. The same rank-order pattern of systematic divergence among methods was reproduced across three independent empirical datasets. In assessing binary adherence to Allen’s rule, only 18% reached the same biological conclusion regardless of the method used.
 4. Statistical approaches used in addressing Allen’s rule estimate different quantities of relative appendage length and can greatly impact conclusions regarding adherence to Allen’s rule. No single approach provides a universally ‘correct’ measure, but the SLI methods offer greater transparency, interpretability, and flexibility over ratio approaches. Multiple regression answers a specific question about the conditional relationship between appendage and temperature, which is appropriate in many contexts. Researchers must explicitly define their research question and match the estimator to it. `\par`{=latex}
keywords:
  - Allen's rule
  - Bergmann's rule
  - ecogeography
  - multiple regression
  - ratios
  - relative appendage length
  - standardized length index
  - standardized major axis regression

