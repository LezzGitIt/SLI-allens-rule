abstract: |
 Background: Studies of Allen's rule, the tendency for endotherms to have relatively longer appendages in warmer climates, require quantifying appendage length relative to body size. Two approaches dominate the empirical literature: simple ratios and multiple regression with body size as a covariate. These approaches differ in how they define and quantify relative appendage size, including assumptions about allometric scaling and how temperature-associated variation in body size and appendage size is partitioned.

 Aims: I characterize what quantity each of six common statistical approaches, including a newly introduced approach, the Standardized Length Index (SLI), estimates when applied to simulated temperature-associated shape change, and how each approach's implicit or explicit assumptions shape that estimate.

 Methods: I simulated morphological data for 252 hypothetical species drawn from a multivariate normal distribution, varying appendage-mass correlation, allometric scaling slope, and the direction of temperature's effect on shape. Each dataset was analysed with two ratio approaches, two multiple regression approaches, and two versions of the SLI, one using an isometric scaling exponent ($b_{SLI} = 0.33$) and one using the empirically estimated slope. We also confronted the six methods with empirical data from 119 species and three independent datasets collected across spatial and temporal temperature gradients.

 Results: Body-size adjustment was not a neutral statistical step: methods define relative appendage length against different reference relationships and consequently estimate different quantities. Ratio methods and OLS-based approaches (multiple regression, residual regression) diverged systematically and in opposite directions from an isometrically-defined reference quantity: ratio methods diverged positively, whereas OLS-based approaches diverged negatively. SLI-isometry tracked the isometric reference quantity closely, as expected given their shared theoretical basis, whereas SLI-estimated diverged from it whenever a species' own allometric scaling departed from isometry. Thus, the two SLI parameterizations define distinct quantities rather than representing competing estimators of a single quantity. The same rank-order pattern of systematic divergence among methods was reproduced across three independent empirical datasets.

 Main conclusions: Conclusions regarding adherence to Allen's rule depend substantially on the statistical approach used to define relative appendage length, because different approaches quantify relative appendage change in different ways and consequently estimate different quantities. No single approach provides a universally correct measure of relative appendage change: the appropriate approach depends on the biological question being asked and the assumptions made about how body size and appendage size are related. The SLI offers two alternatives to ratio and OLS-based approaches, with parameterizations anchored either to isometry or to a species' own empirical scaling, each corresponding to a distinct question about relative appendage change. Both SLI parameterizations are implemented in a single function call in R.
keywords: 
  - Allen's rule, Bergmann's rule, ecogeography, multiple regression, ratios, relative appendage length, review, standaridzed length index, standardized major axis regression, thermoregulation
  
